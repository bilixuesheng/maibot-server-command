name: Publish and verify v1.0.19

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v1.0.19.yml

permissions:
  contents: write

jobs:
  gate:
    name: Release gate / SDK ${{ matrix.sdk }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        sdk:
          - "2.3.0"
          - "2.7.1"

    steps:
      - name: Check out the exact product commit
        uses: actions/checkout@v4
        with:
          ref: 5578692bd4b892eada679199178f5e2a3ccbd175

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install release-gate dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap util-linux
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install "maibot-plugin-sdk==${{ matrix.sdk }}"
          python -m pip install "ruff==0.12.7"

      - name: Verify declared release versions
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(
              Path("_manifest.json").read_text(encoding="utf-8")
          )
          assert manifest["version"] == "1.0.19"
          assert manifest["host_application"] == {
              "min_version": "1.1.0",
              "max_version": "1.1.2",
          }
          assert manifest["sdk"] == {
              "min_version": "2.3.0",
              "max_version": "2.7.1",
          }
          PY

      - name: Compile and lint
        run: |
          python -m py_compile executor.py file_upload.py plugin.py temp_cleanup.py
          python -m py_compile tests/test_stability.py
          ruff check executor.py file_upload.py plugin.py temp_cleanup.py tests

      - name: Run unit and security regression tests
        env:
          PYTHONWARNINGS: error::ResourceWarning
        run: python -m unittest discover -s tests -v

      - name: Run real Bubblewrap and ROOT integration
        shell: bash
        run: |
          PYTHON_BIN="$(command -v python)"
          sudo env MAIBOT_INTEGRATION=1 "$PYTHON_BIN" \
            -m unittest tests.test_stability.RealUbuntuIntegrationTests -v

  release:
    name: Create and verify release
    needs:
      - gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Refuse an existing tag or release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.19 --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release v1.0.19 already exists; refusing to overwrite it." >&2
            exit 1
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v1.0.19" >/dev/null 2>&1; then
            echo "Tag v1.0.19 already exists; refusing to overwrite it." >&2
            exit 1
          fi

      - name: Check out the exact product commit
        uses: actions/checkout@v4
        with:
          ref: 5578692bd4b892eada679199178f5e2a3ccbd175
          fetch-depth: 0

      - name: Build and verify the exact release archive
        shell: bash
        run: |
          mkdir -p release/maibot-server-command/assets
          cp .gitignore LICENSE README.md _manifest.json executor.py file_upload.py plugin.py requirements.txt temp_cleanup.py release/maibot-server-command/
          cp assets/icon.png release/maibot-server-command/assets/icon.png
          TZ=UTC find release/maibot-server-command -exec touch -t 202607301200.00 {} +
          (
            cd release
            TZ=UTC zip -X -q maibot-server-command-v1.0.19.zip \
              maibot-server-command/ \
              maibot-server-command/temp_cleanup.py \
              maibot-server-command/requirements.txt \
              maibot-server-command/_manifest.json \
              maibot-server-command/LICENSE \
              maibot-server-command/file_upload.py \
              maibot-server-command/.gitignore \
              maibot-server-command/plugin.py \
              maibot-server-command/assets/ \
              maibot-server-command/assets/icon.png \
              maibot-server-command/README.md \
              maibot-server-command/executor.py
          )
          echo "61b680f6d593f0fa90a89869e69d788882169ddc6eb76be53346294a7b11d246  release/maibot-server-command-v1.0.19.zip" | sha256sum --check --strict
          test "$(unzip -Z1 release/maibot-server-command-v1.0.19.zip | grep -v '/$' | wc -l)" -eq 10
          ! unzip -Z1 release/maibot-server-command-v1.0.19.zip | grep -Eq '(^|/)(config\.toml|ci_|__pycache__|.*\.pyc$|\.github/|tests?/|.*\.patch$)'

      - name: Write release notes
        shell: bash
        run: |
          cat > release-notes.md <<'RELEASE_NOTES'
          ## 支持版本

          - MaiBot：1.1.0 ～ 1.1.2
          - **1.1.2 是本插件发布时的 MaiBot 最新正式版本。**
          - maibot-plugin-sdk：2.3.0 ～ 2.7.1
          - **2.7.1 是本插件发布时的 maibot-plugin-sdk 最新正式版本。**
          - 本次发布只更新插件，不修改 MaiBot 主程序。

          ## 更新日志

          ### 修复正常 APK 误报

          - 修复正常 APK 因内含 Gzip、JAR、SQLite、公开 CA 证书、二进制符号或文件名中的 `token` 字样而被误报为敏感文件。
          - 不按 `.apk` 后缀放行；所有群聊仍执行完整的可见内容、路径和容器结构扫描。
          - 可读取 ZIP 与小型嵌套 ZIP 会在共享条目、字节、深度和数量预算内继续扫描。
          - ZIP 目录穿越、符号链接、FIFO/设备等特殊成员、CRC/读取错误、声明大小异常和解压预算超限仍会拒绝。

          ### 允许正常加密与不透明载荷

          - ZIP 加密成员、未知 ZIP 压缩方法、Gzip、7z、RAR、Bzip2、XZ、age 与 OpenSSL `Salted__` 不再仅因格式本身被拒绝。
          - 加密成员的可见路径仍会检查，明确指向 `.ssh/id_rsa`、凭据目录等高风险位置时仍拒绝。
          - 插件无法检查加密或不支持格式的明文；允许这些格式不代表其内部内容已被证明安全。

          ### 稳定性与权限边界

          - 白名单只在真实 QQ 私聊发起并发回同一私聊时生效；所有群聊始终开启敏感扫描。
          - 恢复并保留 1.0.16 的稳定性修复：Host 取消时回收命令进程、临时目录共享预算、本地路径大 ZIP 扫描预算、内容寻址模块缓存，以及普通上传入口自动复核可信私聊。
          - 普通 Token/JWT、完整私钥、真实认证头、Cookie、凭据赋值和 URL 密码仍会拒绝；代码占位符、运行时取值表达式和随机二进制片段不再作为凭据本身。
          - 发布包不包含 Host 文件、主程序补丁、测试文件或 CI 文件。

          ## 验证记录

          - Ubuntu 24.04 下分别使用 SDK 2.3.0 与发布时最新 SDK 2.7.1 通过编译、Ruff、完整单元与安全回归门禁。
          - 真实 Bubblewrap、UID 0 降权和 ROOT 监督器集成测试通过。
          - 官方 APK 在群聊扫描开启状态下实跑通过：70,922,619 字节，源文件与 NapCat 只读暂存副本 SHA-256 一致，身份复核及精确删除通过。
          - 系统 `zip -P` 生成的真实加密 ZIP，以及 ZIP64、数据描述符、重复成员、未知方法、Windows/Unicode 路径均已覆盖。
          - 正式 ZIP 只有一个 `maibot-server-command/` 顶层目录和 10 个运行文件，内容与发布源码逐字节一致。

          ## 文件校验

          `maibot-server-command-v1.0.19.zip`

          SHA-256：`61b680f6d593f0fa90a89869e69d788882169ddc6eb76be53346294a7b11d246`
          RELEASE_NOTES

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.19 \
            release/maibot-server-command-v1.0.19.zip \
            --repo "${GITHUB_REPOSITORY}" \
            --target 5578692bd4b892eada679199178f5e2a3ccbd175 \
            --title "服务器命令执行 v1.0.19" \
            --notes-file release-notes.md \
            --latest

      - name: Verify the public tag, notes, and asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v1.0.19")"
          jq -e '
            .tag_name == "v1.0.19" and
            .name == "服务器命令执行 v1.0.19" and
            .draft == false and
            .prerelease == false and
            ([.assets[] | select(.name == "maibot-server-command-v1.0.19.zip")] | length == 1) and
            (.assets | length == 1)
          ' <<<"${release_json}" >/dev/null
          body="$(jq -r '.body' <<<"${release_json}")"
          grep -Fq "1.1.2 是本插件发布时的 MaiBot 最新正式版本" <<<"${body}"
          grep -Fq "61b680f6d593f0fa90a89869e69d788882169ddc6eb76be53346294a7b11d246" <<<"${body}"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/commits/v1.0.19" --jq '.sha')" = "5578692bd4b892eada679199178f5e2a3ccbd175"
          mkdir -p release-verification
          gh release download v1.0.19 \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "maibot-server-command-v1.0.19.zip" \
            --dir release-verification
          echo "61b680f6d593f0fa90a89869e69d788882169ddc6eb76be53346294a7b11d246  release-verification/maibot-server-command-v1.0.19.zip" | sha256sum --check --strict

      - name: Remove this temporary workflow
        shell: bash
        run: |
          git fetch origin main
          git checkout -B main origin/main
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/publish-v1.0.19.yml
          git commit -m "chore: remove temporary v1.0.19 release workflow (release and SHA-256 verified)"
          git push origin HEAD:main
