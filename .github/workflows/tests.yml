name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ubuntu:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap util-linux
          python -m pip install --disable-pip-version-check -r requirements.txt pytest

      - name: Run unit tests as the runner user
        run: python -m pytest -q

      - name: Run ROOT cleanup and real Bubblewrap tests
        run: |
          PYTHON_BIN="$(command -v python)"
          sudo env MAIBOT_BWRAP_INTEGRATION=1 "$PYTHON_BIN" -m pytest -q tests/test_executor.py
