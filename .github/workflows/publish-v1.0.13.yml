name: Verify v1.0.13 Release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v1.0.13.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out main for cleanup
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify tag, release notes, and asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v1.0.13")"
          jq -e '
            .tag_name == "v1.0.13" and
            .name == "服务器命令执行 v1.0.13" and
            .draft == false and
            .prerelease == false and
            ([.assets[] | select(.name == "maibot-server-command-1.0.13.zip")] | length == 1) and
            (.assets | length == 1)
          ' <<<"${release_json}" >/dev/null

          body="$(jq -r '.body' <<<"${release_json}")"
          grep -Fq "最低 MaiBot 版本：1.0.8" <<<"${body}"
          grep -Fq "发布时最高版本：1.1.2（2026-07-29 发布时 MaiBot 官方最新稳定版本）" <<<"${body}"
          grep -Fq "## 更新日志" <<<"${body}"
          grep -Fq "SHA-256: 078a06945007893d0b10a8173d826f51f5c8752672f53bb6a7dc0d3b60b659fc" <<<"${body}"

          tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/v1.0.13" --jq '.sha')"
          test "${tag_sha}" = "b4c7499d9067c49b6e8f1546506bc75dca9ff468"

          mkdir -p release-verification
          gh release download v1.0.13             --repo "${GITHUB_REPOSITORY}"             --pattern "maibot-server-command-1.0.13.zip"             --dir release-verification
          echo "078a06945007893d0b10a8173d826f51f5c8752672f53bb6a7dc0d3b60b659fc  release-verification/maibot-server-command-1.0.13.zip" | sha256sum --check --strict

      - name: Remove temporary workflow after successful verification
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --ff-only origin main
          git rm .github/workflows/publish-v1.0.13.yml
          git commit -m "chore: remove temporary v1.0.13 release workflow (release and SHA-256 verified)"
          git push origin HEAD:main
