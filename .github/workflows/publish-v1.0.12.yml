name: Publish v1.0.12

on:
  push:
    paths:
      - ".github/workflows/publish-v1.0.12.yml"

permissions:
  contents: write
  statuses: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Create v1.0.12 release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v1.0.12
          ASSET: maibot-server-command-1.0.12.zip
          EXPECTED_SHA256: 89d9dc8a947e50773b069956a14d17ec20f8c2e315f64e3702168bc0c58ebdb9
          TARGET_COMMIT: 3ed9b34d64cda720e8915ac9f3345ed2c4cd2783
        run: |
          set -Eeuo pipefail
          report_status() {
            code=$?
            trap - EXIT
            if [ "$code" -eq 0 ]; then
              state=success
              description="v1.0.12 release published"
            else
              state=failure
              description="v1.0.12 release publication failed"
            fi
            gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              -f state="$state" \
              -f context="release/v1.0.12" \
              -f description="$description" \
              -f target_url="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}" >/dev/null || true
            exit "$code"
          }
          trap report_status EXIT

          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists" >&2
            exit 20
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists" >&2
            exit 21
          fi

