name: Publish and verify v1.0.22

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v1.0.22.yml

permissions:
  contents: write

jobs:
  gate:
    name: Release gate / SDK ${{ matrix.sdk }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        sdk:
          - "2.3.0"
          - "2.8.2"

    steps:
      - name: Check out the exact product commit
        uses: actions/checkout@v4
        with:
          ref: 30de3ad4b4b701a60f3618cc4f765e39cc3bcbbb

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install release-gate dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap util-linux
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install "maibot-plugin-sdk==${{ matrix.sdk }}"
          python -m pip install "ruff==0.12.7"

      - name: Verify release metadata and unchanged compatibility ranges
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(
              Path("_manifest.json").read_text(encoding="utf-8")
          )
          assert manifest["version"] == "1.0.22"
          assert manifest["name"] == "麦麦操作服务器与发送文件"
          assert manifest["host_application"] == {
              "min_version": "1.1.0",
              "max_version": "1.99.99",
          }
          assert manifest["sdk"] == {
              "min_version": "2.3.0",
              "max_version": "2.99.99",
          }
          PY

      - name: Compile and lint
        run: |
          python -m py_compile executor.py file_upload.py plugin.py temp_cleanup.py
          python -m py_compile tests/test_stability.py
          ruff check executor.py file_upload.py plugin.py temp_cleanup.py tests

      - name: Run unit and security regression tests
        env:
          PYTHONWARNINGS: error::ResourceWarning
        run: python -m unittest discover -s tests -v

      - name: Run real Bubblewrap and ROOT integration
        shell: bash
        run: |
          PYTHON_BIN="$(command -v python)"
          sudo env MAIBOT_INTEGRATION=1 "$PYTHON_BIN" \
            -m unittest tests.test_stability.RealUbuntuIntegrationTests -v

  release:
    name: Create and verify release
    needs:
      - gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Refuse an existing tag or release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.22 --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release v1.0.22 already exists; refusing to overwrite it." >&2
            exit 1
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v1.0.22" >/dev/null 2>&1; then
            echo "Tag v1.0.22 already exists; refusing to overwrite it." >&2
            exit 1
          fi

      - name: Check out the exact product commit
        uses: actions/checkout@v4
        with:
          ref: 30de3ad4b4b701a60f3618cc4f765e39cc3bcbbb
          fetch-depth: 0

      - name: Build and verify the exact release archive
        shell: bash
        run: |
          mkdir -p release/maibot-server-command/assets
          cp .gitignore LICENSE README.md _manifest.json executor.py file_upload.py plugin.py requirements.txt temp_cleanup.py release/maibot-server-command/
          cp assets/icon.png release/maibot-server-command/assets/icon.png
          TZ=UTC find release/maibot-server-command -exec touch -t 202609241300.00 {} +
          (
            cd release
            TZ=UTC zip -X -q maibot-server-command-v1.0.22.zip \
              maibot-server-command/ \
              maibot-server-command/.gitignore \
              maibot-server-command/LICENSE \
              maibot-server-command/README.md \
              maibot-server-command/_manifest.json \
              maibot-server-command/assets/ \
              maibot-server-command/assets/icon.png \
              maibot-server-command/executor.py \
              maibot-server-command/file_upload.py \
              maibot-server-command/plugin.py \
              maibot-server-command/requirements.txt \
              maibot-server-command/temp_cleanup.py
          )
          echo "7266d12ab348fcc76afe82b5dbcf5ed7a96a991be1909f77d49d5605cad92c98  release/maibot-server-command-v1.0.22.zip" | sha256sum --check --strict
          test "$(unzip -Z1 release/maibot-server-command-v1.0.22.zip | grep -v '/$' | wc -l)" -eq 10
          test "$(unzip -Z1 release/maibot-server-command-v1.0.22.zip | cut -d/ -f1 | sort -u)" = "maibot-server-command"
          ! unzip -Z1 release/maibot-server-command-v1.0.22.zip | grep -Eq '(^|/)(config\.toml|ci_|__pycache__|.*\.pyc$|\.github/|tests?/|.*\.patch$)'

      - name: Write release notes
        shell: bash
        run: |
          cat > release-notes.md <<'RELEASE_NOTES'
          ## 支持版本

          - MaiBot 兼容范围不变：1.1.0 ～ 1.99.99；已按 MaiBot 1.2.5（当前最新版）源码核对插件依赖的 Host 行为。
          - 已回归 maibot-plugin-sdk：2.3.0 与 2.8.2。
          - 本次发布只更新插件，不修改 MaiBot 主程序。

          ## 更新日志

          ### 适配 MaiBot 1.2.x 发送回执

          - 文件发送请求 MaiBot 1.2.0 / SDK 2.8.0 新增的 `return_details=True`，把平台确认的消息 ID 写入审计日志和工具结果的 `platform_message_id` 字段。
          - 同时兼容三种返回格式：SDK 2.8+ 的 `{"sent", "message_id"}`、旧 Host 的 `{"success"}` 和 SDK 2.3～2.7 的布尔值；只有明确为 `True` 的确认才视为发送成功，失败或不确定时照旧保留暂存副本、不删除临时源文件。
          - 旧版 Host 或 SDK 下消息 ID 显示为不可用，其余行为与 1.0.21 完全一致。

          ### 兼容性核对（MaiBot 1.2.5 / SDK 2.8.2）

          - 旧 Action 调用仍由 Host 强制覆盖真实 `stream_id`，可信 QQ 私聊的身份绑定保持有效。
          - `chat_scope`、组件 `timeout_ms`、聊天流字段（`stream_id`、`user_id`、`group_id`、`account_id`、`chat_type`）与 `send.custom("file")` 均未变化。
          - SDK 2.8.2 对 `@Action` 给出废弃提示，但仍完整支持并在内部转为 `plugin.invoke_action` 工具；可信私聊依赖该路径，因此保留不变。

          ### 保持既有安全边界

          - 白名单只在真实 QQ 私聊发起并发回同一私聊时生效；所有群聊始终执行敏感扫描。
          - ROOT 资源边界、高风险命令正则、敏感内容扫描和临时文件精确清理逻辑均与 1.0.21 一致。
          - 发布包不包含 Host 文件、MaiBot 主程序补丁、测试文件或 CI 文件。

          ## 验证记录

          - SDK 2.3.0 与 2.8.2 各运行 35 项回归（发送回执测试覆盖新旧 Host/SDK 的全部返回格式），ResourceWarning 作为错误处理。
          - GitHub Ubuntu 24.04 门禁重复执行编译、Ruff、双 SDK 全量回归及真实 Bubblewrap/ROOT 集成。
          - 正式 ZIP 只有一个 `maibot-server-command/` 顶层目录和 10 个运行文件，内容与发布源码逐字节一致。

          ## 文件校验

          `maibot-server-command-v1.0.22.zip`

          SHA-256：`7266d12ab348fcc76afe82b5dbcf5ed7a96a991be1909f77d49d5605cad92c98`
          RELEASE_NOTES

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.22 \
            release/maibot-server-command-v1.0.22.zip \
            --repo "${GITHUB_REPOSITORY}" \
            --target 30de3ad4b4b701a60f3618cc4f765e39cc3bcbbb \
            --title "麦麦操作服务器与发送文件 v1.0.22" \
            --notes-file release-notes.md \
            --latest

      - name: Verify the public tag, notes, and asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v1.0.22")"
          jq -e '
            .tag_name == "v1.0.22" and
            .name == "麦麦操作服务器与发送文件 v1.0.22" and
            .draft == false and
            .prerelease == false and
            ([.assets[] | select(.name == "maibot-server-command-v1.0.22.zip")] | length == 1) and
            (.assets | length == 1)
          ' <<<"${release_json}" >/dev/null
          body="$(jq -r '.body' <<<"${release_json}")"
          grep -Fq "已回归 maibot-plugin-sdk：2.3.0 与 2.8.2" <<<"${body}"
          grep -Fq "7266d12ab348fcc76afe82b5dbcf5ed7a96a991be1909f77d49d5605cad92c98" <<<"${body}"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/commits/v1.0.22" --jq '.sha')" = "30de3ad4b4b701a60f3618cc4f765e39cc3bcbbb"
          mkdir -p release-verification
          gh release download v1.0.22 \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "maibot-server-command-v1.0.22.zip" \
            --dir release-verification
          echo "7266d12ab348fcc76afe82b5dbcf5ed7a96a991be1909f77d49d5605cad92c98  release-verification/maibot-server-command-v1.0.22.zip" | sha256sum --check --strict

      - name: Remove this temporary workflow
        shell: bash
        run: |
          git fetch origin main
          git checkout -B main origin/main
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/publish-v1.0.22.yml
          git commit -m "chore: remove temporary v1.0.22 release workflow (release and SHA-256 verified)"
          git push origin HEAD:main
