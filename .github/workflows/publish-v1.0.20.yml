name: Publish and verify v1.0.20

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v1.0.20.yml

permissions:
  contents: write

jobs:
  gate:
    name: Release gate / SDK ${{ matrix.sdk }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        sdk:
          - "2.3.0"
          - "2.7.1"

    steps:
      - name: Check out the exact product commit
        uses: actions/checkout@v4
        with:
          ref: 1d8aa3a40e08d52dee08db378627d5402dc73554

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install release-gate dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap util-linux
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install "maibot-plugin-sdk==${{ matrix.sdk }}"
          python -m pip install "ruff==0.12.7"

      - name: Verify release metadata and unchanged compatibility ranges
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(
              Path("_manifest.json").read_text(encoding="utf-8")
          )
          assert manifest["version"] == "1.0.20"
          assert manifest["name"] == "麦麦操作服务器与发送文件"
          assert manifest["host_application"] == {
              "min_version": "1.1.0",
              "max_version": "1.99.99",
          }
          assert manifest["sdk"] == {
              "min_version": "2.3.0",
              "max_version": "2.99.99",
          }
          PY

      - name: Compile and lint
        run: |
          python -m py_compile executor.py file_upload.py plugin.py temp_cleanup.py
          python -m py_compile tests/test_stability.py
          ruff check executor.py file_upload.py plugin.py temp_cleanup.py tests

      - name: Run unit and security regression tests
        env:
          PYTHONWARNINGS: error::ResourceWarning
        run: python -m unittest discover -s tests -v

      - name: Run real Bubblewrap and ROOT integration
        shell: bash
        run: |
          PYTHON_BIN="$(command -v python)"
          sudo env MAIBOT_INTEGRATION=1 "$PYTHON_BIN" \
            -m unittest tests.test_stability.RealUbuntuIntegrationTests -v

  release:
    name: Create and verify release
    needs:
      - gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Refuse an existing tag or release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.20 --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release v1.0.20 already exists; refusing to overwrite it." >&2
            exit 1
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v1.0.20" >/dev/null 2>&1; then
            echo "Tag v1.0.20 already exists; refusing to overwrite it." >&2
            exit 1
          fi

      - name: Check out the exact product commit
        uses: actions/checkout@v4
        with:
          ref: 1d8aa3a40e08d52dee08db378627d5402dc73554
          fetch-depth: 0

      - name: Build and verify the exact release archive
        shell: bash
        run: |
          mkdir -p release/maibot-server-command/assets
          cp .gitignore LICENSE README.md _manifest.json executor.py file_upload.py plugin.py requirements.txt temp_cleanup.py release/maibot-server-command/
          cp assets/icon.png release/maibot-server-command/assets/icon.png
          TZ=UTC find release/maibot-server-command -exec touch -t 202608011200.00 {} +
          (
            cd release
            TZ=UTC zip -X -q maibot-server-command-v1.0.20.zip \
              maibot-server-command/ \
              maibot-server-command/.gitignore \
              maibot-server-command/LICENSE \
              maibot-server-command/README.md \
              maibot-server-command/_manifest.json \
              maibot-server-command/assets/ \
              maibot-server-command/assets/icon.png \
              maibot-server-command/executor.py \
              maibot-server-command/file_upload.py \
              maibot-server-command/plugin.py \
              maibot-server-command/requirements.txt \
              maibot-server-command/temp_cleanup.py
          )
          echo "9125bce7efe0e4e9d4a401e3ac1c858618738fad76d374092a9f1822cca6d2d2  release/maibot-server-command-v1.0.20.zip" | sha256sum --check --strict
          test "$(unzip -Z1 release/maibot-server-command-v1.0.20.zip | grep -v '/$' | wc -l)" -eq 10
          test "$(unzip -Z1 release/maibot-server-command-v1.0.20.zip | cut -d/ -f1 | sort -u)" = "maibot-server-command"
          ! unzip -Z1 release/maibot-server-command-v1.0.20.zip | grep -Eq '(^|/)(config\.toml|ci_|__pycache__|.*\.pyc$|\.github/|tests?/|.*\.patch$)'

      - name: Write release notes
        shell: bash
        run: |
          cat > release-notes.md <<'RELEASE_NOTES'
          ## 支持版本

          - 已确认支持 MaiBot：1.1.0 ～ 1.1.3。
          - **MaiBot 1.1.3 是本插件发布时的最新正式版本。**
          - 已回归 maibot-plugin-sdk：2.3.0 与 2.7.1。
          - 项目 Manifest 的原有兼容范围保持不变；本次发布只更新插件，不修改 MaiBot 主程序。

          ## 更新日志

          ### 修复 ROOT 错误继承沙箱资源限制

          - 内存、单文件大小、文件描述符、进程数和命令运行时间限制现在只应用于低权限 Bubblewrap 沙箱。
          - 受限 ROOT、完全 ROOT 和可信 QQ 私聊 ROOT 绕过不再设置沙箱 RLIMIT，也不再按 20～300 秒的沙箱命令超时终止。
          - 受限 ROOT 的高风险命令正则仍然生效；完全 ROOT 继续按既有设计关闭该正则。
          - stdout/stderr 的回传大小仍受限制；截断只影响返回给麦麦的文本，不终止命令。
          - ROOT 命令正常退出或工具调用被取消后，监督器仍清理本次命令产生的后台后代进程。
          - MaiBot Host 要求组件 RPC 使用有限期限，因此命令工具使用一年期传输兜底；低权限沙箱仍由内部 1～300 秒限制结束。

          ### 保持既有安全边界

          - 白名单只在真实 QQ 私聊发起并发回同一私聊时生效；所有群聊始终执行敏感扫描。
          - 文件上传扫描、APK 误报修复、加密/不透明载荷策略和临时文件精确清理逻辑均未改变。
          - 发布包不包含 Host 文件、MaiBot 主程序补丁、测试文件或 CI 文件。

          ## 验证记录

          - SDK 2.3.0 与 2.7.1 各运行 31 项回归：29 项通过，2 项因本地集成开关/环境按设计跳过；ResourceWarning 作为错误处理。
          - GitHub Ubuntu 24.04 门禁重复执行编译、Ruff、双 SDK 全量回归及真实 Bubblewrap/ROOT 集成。
          - 真实 ROOT 子进程的 `RLIMIT_AS`、`RLIMIT_FSIZE`、`RLIMIT_CPU`、`RLIMIT_NOFILE`、`RLIMIT_NPROC` 与父进程一致，并完成 300 MiB 内存分配和 65 MiB 文件写入。
          - 受限 ROOT 实际执行 `tar -czf` 成功生成 73,412,348 字节的归档，超过旧 64 MiB 上限。
          - 正式 ZIP 只有一个 `maibot-server-command/` 顶层目录和 10 个运行文件，内容与发布源码逐字节一致。

          ## 文件校验

          `maibot-server-command-v1.0.20.zip`

          SHA-256：`9125bce7efe0e4e9d4a401e3ac1c858618738fad76d374092a9f1822cca6d2d2`
          RELEASE_NOTES

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.20 \
            release/maibot-server-command-v1.0.20.zip \
            --repo "${GITHUB_REPOSITORY}" \
            --target 1d8aa3a40e08d52dee08db378627d5402dc73554 \
            --title "麦麦操作服务器与发送文件 v1.0.20" \
            --notes-file release-notes.md \
            --latest

      - name: Verify the public tag, notes, and asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v1.0.20")"
          jq -e '
            .tag_name == "v1.0.20" and
            .name == "麦麦操作服务器与发送文件 v1.0.20" and
            .draft == false and
            .prerelease == false and
            ([.assets[] | select(.name == "maibot-server-command-v1.0.20.zip")] | length == 1) and
            (.assets | length == 1)
          ' <<<"${release_json}" >/dev/null
          body="$(jq -r '.body' <<<"${release_json}")"
          grep -Fq "MaiBot 1.1.3 是本插件发布时的最新正式版本" <<<"${body}"
          grep -Fq "9125bce7efe0e4e9d4a401e3ac1c858618738fad76d374092a9f1822cca6d2d2" <<<"${body}"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/commits/v1.0.20" --jq '.sha')" = "1d8aa3a40e08d52dee08db378627d5402dc73554"
          mkdir -p release-verification
          gh release download v1.0.20 \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "maibot-server-command-v1.0.20.zip" \
            --dir release-verification
          echo "9125bce7efe0e4e9d4a401e3ac1c858618738fad76d374092a9f1822cca6d2d2  release-verification/maibot-server-command-v1.0.20.zip" | sha256sum --check --strict

      - name: Remove this temporary workflow
        shell: bash
        run: |
          git fetch origin main
          git checkout -B main origin/main
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/publish-v1.0.20.yml
          git commit -m "chore: remove temporary v1.0.20 release workflow (release and SHA-256 verified)"
          git push origin HEAD:main
